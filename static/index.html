<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction RAG — Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; color: #fff; }
    header span { font-size: 0.8rem; color: #6b7280; }

    /* ── Upload bar ── */
    #upload-bar {
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    #upload-bar label {
      font-size: 0.82rem;
      color: #9ca3af;
      white-space: nowrap;
    }
    #pdf-input { display: none; }
    #upload-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #upload-btn:hover { background: #1d4ed8; }
    #upload-btn:disabled { background: #374151; cursor: not-allowed; }
    #file-name {
      font-size: 0.8rem;
      color: #6b7280;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #upload-status {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      display: none;
    }
    #upload-status.success { background: #064e3b; color: #6ee7b7; display: inline-block; }
    #upload-status.error   { background: #7f1d1d; color: #fca5a5; display: inline-block; }
    #upload-status.loading { background: #1e3a5f; color: #93c5fd; display: inline-block; }

    /* ── Chat window ── */
    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 780px;
    }
    .msg.user  { align-self: flex-end; align-items: flex-end; }
    .msg.bot   { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: #1e2130;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
      border: 1px solid #2a2d3a;
    }
    .msg-meta {
      font-size: 0.72rem;
      color: #4b5563;
      margin-top: 4px;
      padding: 0 4px;
    }

    /* ── Transaction table ── */
    .txn-table-wrap {
      margin-top: 12px;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #2a2d3a;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    thead { background: #11141f; }
    th {
      padding: 8px 12px;
      text-align: left;
      color: #6b7280;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #2a2d3a;
    }
    td {
      padding: 8px 12px;
      border-bottom: 1px solid #1e2130;
      color: #d1d5db;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1a1d27; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge.credit   { background: #064e3b; color: #6ee7b7; }
    .badge.debit    { background: #7f1d1d; color: #fca5a5; }
    .badge.unknown  { background: #374151; color: #9ca3af; }
    .badge.completed { background: #1e3a5f; color: #93c5fd; }
    .badge.pending   { background: #44371a; color: #fcd34d; }
    .badge.failed    { background: #7f1d1d; color: #fca5a5; }
    .badge.reversed  { background: #374151; color: #9ca3af; }

    /* ── Sources ── */
    .sources {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #4b5563;
    }
    .sources span {
      background: #1e2130;
      border: 1px solid #2a2d3a;
      border-radius: 4px;
      padding: 2px 6px;
      margin-right: 4px;
    }

    /* ── Typing indicator ── */
    .typing .bubble { padding: 14px 18px; }
    .dot-flashing {
      display: flex; gap: 5px; align-items: center;
    }
    .dot-flashing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4b5563;
      animation: blink 1.2s infinite;
    }
    .dot-flashing span:nth-child(2) { animation-delay: 0.2s; }
    .dot-flashing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40%            { opacity: 1; }
    }

    /* ── Input bar ── */
    #input-bar {
      background: #1a1d27;
      border-top: 1px solid #2a2d3a;
      padding: 14px 24px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #query-input {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      color: #e0e0e0;
      font-size: 0.92rem;
      padding: 10px 14px;
      resize: none;
      outline: none;
      max-height: 140px;
      line-height: 1.5;
      font-family: inherit;
    }
    #query-input:focus { border-color: #2563eb; }
    #query-input::placeholder { color: #4b5563; }
    #send-btn {
      background: #2563eb;
      border: none;
      border-radius: 10px;
      width: 42px; height: 42px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #send-btn:hover { background: #1d4ed8; }
    #send-btn:disabled { background: #374151; cursor: not-allowed; }
    #send-btn svg { fill: #fff; width: 18px; height: 18px; }

    /* ── Empty state ── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #4b5563;
      pointer-events: none;
    }
    #empty-state svg { width: 48px; height: 48px; opacity: 0.3; }
    #empty-state p { font-size: 0.9rem; }
    .hint-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; pointer-events: all; }
    .chip {
      background: #1e2130;
      border: 1px solid #2a2d3a;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.78rem;
      color: #9ca3af;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .chip:hover { border-color: #2563eb; color: #93c5fd; }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
  </svg>
  <h1>Transaction RAG</h1>
  <span>PDF Statement Analyzer</span>
</header>

<!-- PDF Upload Bar -->
<div id="upload-bar">
  <label>Upload Statement:</label>
  <button id="upload-btn" onclick="document.getElementById('pdf-input').click()">
    📄 Choose PDFs
  </button>
  <input type="file" id="pdf-input" accept=".pdf" multiple onchange="handleFileSelect(this)" />
  <span id="file-name">No files selected</span>
  <span id="upload-status"></span>
</div>

<!-- Chat Window -->
<div id="chat-window">
  <div id="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <p>Upload a PDF statement then ask a question</p>
    <div class="hint-chips">
      <span class="chip" onclick="useHint(this)">Show all debit transactions</span>
      <span class="chip" onclick="useHint(this)">What is my total credit amount?</span>
      <span class="chip" onclick="useHint(this)">List failed or pending transactions</span>
      <span class="chip" onclick="useHint(this)">What is the closing balance?</span>
    </div>
  </div>
</div>

<!-- Input Bar -->
<div id="input-bar">
  <textarea id="query-input" rows="1" placeholder="Ask about your transactions…"
    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="send-btn" onclick="sendQuery()" title="Send">
    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</div>

<script>
  const API = '';  // same origin
  let docId = null;
  const sessionDocs = new Set();

  // ── File upload (multiple, processed one after another) ──────────────────────
  function handleFileSelect(input) {
    const files = [...input.files];
    input.value = '';  // allow re-selecting the same files
    if (!files.length) return;
    document.getElementById('file-name').textContent =
      files.length === 1 ? files[0].name : `${files.length} files`;
    uploadPDFs(files);
  }

  async function uploadPDFs(files) {
    const btn = document.getElementById('upload-btn');
    btn.disabled = true;
    let ok = 0, failed = [];

    for (const [i, file] of files.entries()) {
      btn.textContent = `⏳ ${i + 1}/${files.length}`;
      setStatus('loading', `Processing ${file.name}…`);
      const form = new FormData();
      form.append('file', file);
      try {
        const res = await fetch(`${API}/ingest`, { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Upload failed');
        sessionDocs.add(data.doc_id);
        ok++;
        appendBotMessage(
          `**${file.name}** ingested successfully.\n\n` +
          `• Pages: ${data.total_pages}\n` +
          `• Chunks stored: ${data.chunks_stored}\n` +
          `• Transactions found: ${data.transactions_found}`,
          []
        );
        hideEmptyState();
      } catch (err) {
        failed.push(`${file.name} (${err.message})`);
      }
    }

    // One document → scope queries to it; several → search across all statements.
    docId = sessionDocs.size === 1 ? [...sessionDocs][0] : null;
    if (failed.length) {
      setStatus('error', `✗ ${ok}/${files.length} uploaded. Failed: ${failed.join('; ')}`);
    } else {
      setStatus('success', `✓ ${ok} statement${ok > 1 ? 's' : ''} uploaded`);
    }
    btn.textContent = '📄 Add more PDFs';
    btn.disabled = false;
  }

  function setStatus(type, text) {
    const el = document.getElementById('upload-status');
    el.className = 'upload-status ' + type;
    el.textContent = text;
    el.style.display = 'inline-block';
  }

  // ── Chat ─────────────────────────────────────────────────────────────────────
  function hideEmptyState() {
    const el = document.getElementById('empty-state');
    if (el) el.remove();
  }

  function useHint(chip) {
    document.getElementById('query-input').value = chip.textContent;
    document.getElementById('query-input').focus();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuery();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  async function sendQuery() {
    const input = document.getElementById('query-input');
    const query = input.value.trim();
    if (!query) return;

    hideEmptyState();
    appendUserMessage(query);
    input.value = '';
    input.style.height = 'auto';

    const typingId = appendTyping();
    document.getElementById('send-btn').disabled = true;

    try {
      const res = await fetch(`${API}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, doc_id: docId, top_k: 10 }),
      });
      const data = await res.json();
      removeTyping(typingId);

      if (!res.ok) throw new Error(data.detail || 'Query failed');

      appendBotMessage(data.answer, data.transactions || [], data.sources || []);
    } catch (err) {
      removeTyping(typingId);
      appendBotMessage('⚠️ ' + err.message, []);
    } finally {
      document.getElementById('send-btn').disabled = false;
    }
  }

  // ── Message renderers ────────────────────────────────────────────────────────
  function appendUserMessage(text) {
    const win = document.getElementById('chat-window');
    const msg = document.createElement('div');
    msg.className = 'msg user';
    msg.innerHTML = `
      <div class="bubble">${escHtml(text)}</div>
      <div class="msg-meta">${now()}</div>`;
    win.appendChild(msg);
    scrollDown();
  }

  function appendBotMessage(text, transactions, sources) {
    const win = document.getElementById('chat-window');
    const msg = document.createElement('div');
    msg.className = 'msg bot';

    let html = `<div class="bubble">${formatText(text)}</div>`;

    if (transactions && transactions.length > 0) {
      html += buildTable(transactions);
    }

    if (sources && sources.length > 0) {
      html += `<div class="sources">Sources: ${sources.map(s => `<span>${escHtml(s)}</span>`).join('')}</div>`;
    }

    html += `<div class="msg-meta">${now()}</div>`;
    msg.innerHTML = html;
    win.appendChild(msg);
    scrollDown();
  }

  function buildTable(transactions) {
    const rows = transactions.map(t => `
      <tr>
        <td>${escHtml(t.transaction_date || t.date || '')}</td>
        <td>${escHtml(t.description || '')}</td>
        <td style="text-align:right;font-variant-numeric:tabular-nums">
          ${t.currency || 'USD'} ${Number(t.amount || 0).toFixed(2)}
        </td>
        <td><span class="badge ${(t.transaction_type || t.type || '').toLowerCase()}">${t.transaction_type || t.type || '—'}</span></td>
        <td><span class="badge ${(t.status || '').toLowerCase()}">${t.status || '—'}</span></td>
        <td style="text-align:right;color:#6b7280;font-variant-numeric:tabular-nums">
          ${t.balance != null ? Number(t.balance).toFixed(2) : '—'}
        </td>
      </tr>`).join('');

    return `
      <div class="txn-table-wrap">
        <table>
          <thead><tr>
            <th>Date</th><th>Description</th><th>Amount</th>
            <th>Type</th><th>Status</th><th>Balance</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function appendTyping() {
    const win = document.getElementById('chat-window');
    const id = 'typing-' + Date.now();
    const msg = document.createElement('div');
    msg.className = 'msg bot typing';
    msg.id = id;
    msg.innerHTML = `<div class="bubble"><div class="dot-flashing"><span></span><span></span><span></span></div></div>`;
    win.appendChild(msg);
    scrollDown();
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function scrollDown() {
    const win = document.getElementById('chat-window');
    win.scrollTop = win.scrollHeight;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatText(text) {
    return escHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
</script>
</body>
</html>
